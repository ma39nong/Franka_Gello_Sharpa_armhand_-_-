# Per-topic subscriptions for the tactile-enabled rosbag recorder.
# Keep camera/robot command streams reliable while matching Sharpa sensor-data
# publishers with best_effort. Do not classify by ROS message type: both camera
# frames and tactile deformation use sensor_msgs/msg/Image.

# FR3 actions, status, and state.
/teleop/validated_arm_commands:
  history: keep_last
  depth: 10
  reliability: reliable
  durability: volatile
/teleop/arm_command_status:
  history: keep_last
  depth: 10
  reliability: reliable
  durability: volatile
/left/franka/joint_states:
  history: keep_last
  depth: 10
  reliability: reliable
  durability: volatile
/right/franka/joint_states:
  history: keep_last
  depth: 10
  reliability: reliable
  durability: volatile

# Sharpa commands are reliable; Sharpa state publishers use sensor-data QoS.
/sharpa/left/command:
  history: keep_last
  depth: 10
  reliability: reliable
  durability: volatile
/sharpa/right/command:
  history: keep_last
  depth: 10
  reliability: reliable
  durability: volatile
/sharpa/left/joint_states:
  history: keep_last
  depth: 10
  reliability: best_effort
  durability: volatile
/sharpa/right/joint_states:
  history: keep_last
  depth: 10
  reliability: best_effort
  durability: volatile

