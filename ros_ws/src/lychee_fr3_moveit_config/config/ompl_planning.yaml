planner_configs:
  RRTConnectkConfigDefault:
    type: geometric::RRTConnect
    range: 0.0
  RRTstarkConfigDefault:
    type: geometric::RRTstar
    range: 0.0
    goal_bias: 0.05
    delay_collision_checking: 1
  RRTkConfigDefault:
    type: geometric::RRT
    range: 0.0
    goal_bias: 0.05
  PRMkConfigDefault:
    type: geometric::PRM
    max_nearest_neighbors: 10

left_arm:
  enforce_joint_model_state_space: true
  optimization_objective: PathLengthOptimizationObjective
  planner_configs:
    - RRTConnectkConfigDefault
    - RRTkConfigDefault
    - PRMkConfigDefault

right_arm:
  enforce_joint_model_state_space: true
  optimization_objective: PathLengthOptimizationObjective
  planner_configs:
    - RRTConnectkConfigDefault
    - RRTstarkConfigDefault
    - RRTkConfigDefault
    - PRMkConfigDefault

both_arms:
  planner_configs:
    - RRTConnectkConfigDefault
    - RRTkConfigDefault
    - PRMkConfigDefault
