/**:
  controller_manager:
    ros__parameters:
      # Run the host timer just ahead of the robot's nominal 1 kHz clock.
      # FrankaHardwareInterface::read() blocks for the next FCI state, so the
      # effective loop remains robot-paced at 1 kHz.  Using exactly 1000 Hz
      # lets the independent host/robot clocks drift in phase; on the left FR3
      # the state-to-command delay grew to ~0.8 ms and caused a communication
      # constraints reflex despite zero missing packet IDs.
      update_rate: 1001  # Hz requested; effective FCI rate remains 1000 Hz
      thread_priority: 98
      overruns:
        manage: false
        print_warnings: false

      joint_impedance_controller:
        type: franka_fr3_arm_controllers/JointImpedanceController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

  joint_impedance_controller:
    ros__parameters:
      arm_id: fr3
      command_timeout: 0.25
      max_initial_target_delta: 0.35
      k_alpha: 0.99
      # franka_ros2 example gains. The earlier halved set (312/260/260/260/
      # 104/52/26, d 23/23/23/11.5/11.5/11.5/5.7) left a 20-40 mrad friction
      # deadband on the distal joints, measured as stick-slip in the
      # 2026-07-26 jitter recordings.
      k_gains:
        - 600.0
        - 600.0
        - 600.0
        - 600.0
        - 250.0
        - 150.0
        - 50.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 25.0
        - 25.0
        - 25.0
        - 15.0

  # Match the host safety loop. At 200 Hz the Franka real-time publisher can
  # remain locked while DDS drains the previous sample, flooding the 1 kHz
  # control loop with publish errors.
  joint_state_broadcaster:
    ros__parameters:
      update_rate: 200

  franka_robot_state_broadcaster:
    ros__parameters:
      update_rate: 100
      # franka_ros2 v2.0.4 can lose this publisher's non-blocking lock while
      # the previous state is still being sent.  Treat that as a dropped
      # telemetry sample instead of a controller failure, and never log from
      # the 1 kHz realtime loop.  The FCI read/write result is unaffected.
      lock_update_success: true
      lock_log_error: false
