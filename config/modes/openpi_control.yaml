# Explicit OpenPI deployment profile. Existing teleop_control.yaml is unchanged.
teleop_safety_gateway:
  ros__parameters:
    allowed_sources:
      - openpi
    state_timeout: 0.25
    command_timeout: 0.25
    max_joint_speed: 0.7
    max_initial_delta: 0.05
    nominal_dt: 0.01
    contact_torque_thresholds: [6.0, 6.0, 6.0, 6.0, 3.0, 3.0, 3.0]
